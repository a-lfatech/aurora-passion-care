<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Passion Care</title>
  <desc id="desc">Aurora Passion Care heart and wordmark</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#10b981"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <image href="apc_logo_mark.png" x="0" y="24" width="345" height="405" preserveAspectRatio="xMidYMid meet"/>
  <g font-family="Manrope, Inter, Arial, sans-serif" font-weight="800">
    <text x="370" y="205" font-size="118" letter-spacing="2" fill="url(#aurora)" filter="url(#glow)">AURORA</text>
    <text x="374" y="302" font-size="65" letter-spacing="1" fill="#ffffff">PASSION CARE</text>
    <rect x="374" y="332" width="495" height="5" rx="2.5" fill="url(#aurora)" opacity="0.9"/>
  </g>
</svg>
